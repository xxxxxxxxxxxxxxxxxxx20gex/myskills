server:
  host: 127.0.0.1
  port: 8765

agent:
  default_model: gpt-5.6-terra

codex_cli:
  # auto 优先使用 Codex Desktop 的用户目录 CLI，再尝试 VS Code 与 PATH。
  path: auto
  # 网页任务无法弹出终端审批；需要收紧权限时可改为 workspace-write。
  sandbox: danger-full-access
  approval_policy: never

runs:
  directory: .runs

git:
  # 仅用于 Playground 的 Git 远程操作；0 表示禁用代理。
  proxy_host: 127.0.0.1
  proxy_port: 7897

models:
  - id: gpt-5.6-terra
    label: GPT-5.6 Terra
    api_model: gpt-5.6-terra
  - id: gpt-5.6-sol
    label: GPT-5.6 Sol
    api_model: gpt-5.6-sol
  - id: deepseek-v4-flash
    label: DeepSeek V4 Flash
    api_model: deepseek-v4-flash
